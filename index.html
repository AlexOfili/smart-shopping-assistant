<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Shopping Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Smart Shopping Assistant</h1>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>

    <div class="header-controls">
      <input type="text" id="search" placeholder="Search products..." aria-label="Search products">
      <select id="aisle-filter" aria-label="Filter by aisle">
        <option value="">All aisles</option>
      </select>
      <select id="sort" aria-label="Sort by price">
        <option value="">Sort by</option>
        <option value="asc">Price: Low to High</option>
        <option value="desc">Price: High to Low</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <section id="results" aria-label="Product results">
      <!-- product cards get inserted here by JavaScript -->
    </section>

    <aside class="basket" aria-labelledby="basket-heading">
      <h2 id="basket-heading">My Basket</h2>
      <ul id="basket-items"></ul>
      <p>Total: <span id="total" aria-live="polite">£0.00</span></p>
    </aside>
  </main>

  <div id="weather">Loading store conditions...</div>

  <script src="script.js"></script>

</body>
</html>
